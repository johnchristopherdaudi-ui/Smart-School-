{% extends "templates/web.html" %}

{% block style %}
<style>
:root {
    --sp-primary: #0d3b66;
    --sp-accent: #ffb703;
    --sp-bg: #f4f6f9;
}
body { background: var(--sp-bg); }
.sp-navbar { background: var(--sp-primary); padding: 14px 30px; }
.sp-brand { color: #fff; font-size: 22px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 8px; }
.sp-brand span.sp-logo { background: var(--sp-accent); color: var(--sp-primary); width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; }
.sp-container { max-width: 480px; margin: 40px auto; padding: 0 20px; }
.sp-checkout-card { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 2px 15px rgba(0,0,0,0.08); text-align: center; }
.sp-provider-badge { display: inline-block; background: var(--sp-bg); color: var(--sp-primary); padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; margin-bottom: 20px; }
.sp-amount { font-size: 34px; font-weight: 800; color: var(--sp-primary); margin-bottom: 6px; }
.sp-phone { color: #888; font-size: 14px; margin-bottom: 25px; }
.sp-demo-note { background: #fff3cd; color: #856404; padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 25px; }
.sp-btn-row { display: flex; gap: 12px; }
.sp-btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 700; font-size: 14px; cursor: pointer; }
.sp-btn-success { background: #198754; color: #fff; }
.sp-btn-fail { background: #dc3545; color: #fff; }
.sp-result { display: none; margin-top: 20px; padding: 16px; border-radius: 10px; font-size: 14px; }
.sp-result.show { display: block; }
.sp-result.ok { background: #d4edda; color: #155724; }
.sp-result.bad { background: #f8d7da; color: #721c24; }
.sp-back-link { display: inline-block; margin-top: 16px; color: var(--sp-primary); font-weight: 600; text-decoration: none; font-size: 14px; }
</style>
{% endblock %}

{% block page_content %}
<nav class="sp-navbar">
    <a href="/parent-portal" class="sp-brand"><span class="sp-logo">SS</span> Smart School</a>
</nav>

<div class="sp-container">
    <div class="sp-checkout-card" id="checkoutCard">
        <div class="sp-provider-badge">{{ log.provider }}</div>
        <div class="sp-amount">{{ "{:,.0f}".format(log.amount) }} TZS</div>
        <div class="sp-phone">Namba: {{ log.phone_number }}</div>

        <div class="sp-demo-note">
            Hii ni demo ya malipo. Hakuna pesa halisi itakayotumika. Chagua matokeo ya kuiga.
        </div>

        <div class="sp-btn-row" id="btnRow">
            <button class="sp-btn sp-btn-success" onclick="confirmPayment(1)">Simulate Success</button>
            <button class="sp-btn sp-btn-fail" onclick="confirmPayment(0)">Simulate Failure</button>
        </div>

        <div class="sp-result" id="resultBox"></div>
    </div>
</div>

<script>
function confirmPayment(success) {
    document.getElementById('btnRow').style.display = 'none';

    frappe.call({
        method: 'smart_school.portal_utils.confirm_demo_payment',
        args: {
            reference: "{{ reference }}",
            term: "{{ term }}",
            success: success
        },
        callback: function(r) {
            var box = document.getElementById('resultBox');
            if (r.message && r.message.success) {
                box.className = 'sp-result show ok';
                box.innerHTML = '✅ Malipo yamefanikiwa!<br><a class="sp-back-link" href="/parent-portal/fees?student={{ log.student }}">Rudi kwenye Ada &rarr;</a>';
            } else {
                box.className = 'sp-result show bad';
                box.innerHTML = '❌ Malipo hayakufanikiwa.<br><a class="sp-back-link" href="/parent-portal/fees?student={{ log.student }}">Rudi kwenye Ada &rarr;</a>';
            }
        }
    });
}
</script>
{% endblock %}
